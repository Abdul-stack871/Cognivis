<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>
  <!-- Outer orbital ring with dashed geometric gap -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#283832" stroke-width="2" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#emGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 60" />
  <!-- Inner rhombus / lens node -->
  <polygon points="50,22 78,50 50,78 22,50" fill="none" stroke="#EDE8DC" stroke-width="1.75" stroke-opacity="0.8" />
  <!-- Core nodal focus -->
  <circle cx="50" cy="50" r="7" fill="url(#emGrad)" />
  <circle cx="50" cy="50" r="3" fill="#F7F4EB" />
  <!-- Satellite nodes -->
  <circle cx="50" cy="22" r="3.5" fill="url(#goldGrad)" />
  <circle cx="78" cy="50" r="3" fill="#34D399" />
  <circle cx="50" cy="78" r="3.5" fill="url(#goldGrad)" />
  <circle cx="22" cy="50" r="3" fill="#34D399" />
</svg>